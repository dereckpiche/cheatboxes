# The training recipe: MODEL (run.py's default Qwen3.5-4B) with LoRA,
# GRPO, vLLM rollouts, one environment episode per trajectory. Layered on
# verl's default `ppo_trainer`; anything not set here keeps verl's default.
# run.py adds the preset for the GPUs and the model (hardware/), then the
# command line's overrides.
# ${oc.env:NAME,default} reads an environment variable.

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  # Instances are made as the run asks for them (training.instances), from
  # the environment ENV with its settings: +data.env_config.<key>=<value>.
  env: ${oc.env:ENV,ShortPython}
  env_config: {}
  seed: 0
  custom_cls:
    path: pkg://training.instances
    name: Instances
  train_files: train              # splits, not files
  val_files: val
  shuffle: false                  # instance i at step i // train_batch_size
  train_batch_size: 8             # instances per step; each gets rollout.n samples
  val_max_samples: 64             # validation instances, the same every time
  max_prompt_length: 1024
  # Everything after the prompt: model tokens and tool outputs. The model's
  # own output is capped by the task's budget, so leave room for tools.
  max_response_length: 6144
  apply_chat_template_kwargs:
    enable_thinking: true         # Qwen3.5's small models' template defaults to off
  dataloader_num_workers: 0

algorithm:
  adv_estimator: grpo
  # vLLM and the trainer compute slightly different probabilities. Token
  # weights pi_trainer / pi_vllm are capped at 2, and an episode whose mean
  # log-ratio leaves +-0.01 is dropped.
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_rs: seq_mean_k1
    rollout_rs_threshold: 0.99_1.01

actor_rollout_ref:
  model:
    path: ${oc.env:MODEL}
    use_remove_padding: false     # packed Qwen3.5 sequences get wrong trainer log-probs (rollout_corr/kl 0.06-0.1, 0.0003 unpacked)
    enable_gradient_checkpointing: true
    override_config:
      attn_implementation: flash_attention_2
    lora_rank: 256
    lora_alpha: 512               # twice the rank
    target_modules: all-linear
    lora:
      merge: false                # vLLM applies the adapters itself

  # One full replica per GPU, nothing sharded or offloaded. Strictly
  # on-policy: one optimizer step per rollout batch. No KL term, so no
  # reference pass.
  actor:
    strategy: fsdp2
    optim:
      lr: 3.0e-6
      optimizer: AdamW
      weight_decay: 0.0
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_epochs: 1
    loss_agg_mode: seq-mean-token-mean   # every episode weighs the same
    # One episode per forward pass, in training and in log-prob passes:
    # packs of several long ones ran out of memory on their logits (17.7 GB,
    # rorqual H100, 2026-11-22). The loss is normalized over the whole batch,
    # so this changes speed only.
    use_dynamic_bsz: false
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: false
    entropy_coeff: 0
    fsdp_config:
      fsdp_size: 1
      # verl would cast the adapter to a bf16 base's dtype, where small
      # updates round away.
      model_dtype: fp32
    checkpoint:
      save_lora_only: true        # base weights reload from model.path

  ref:
    log_prob_micro_batch_size_per_gpu: 1   # one episode per pass, as above

  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.3   # shares the GPU with the actor
    load_format: auto             # LoRA never changes the base: vLLM loads it from the checkpoint
    max_model_len: 7168           # prompt + response
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    max_num_seqs: 64              # Qwen3.5's linear attention: one block per sequence
    n: 8                          # GRPO group size
    calculate_log_probs: true     # for the rollout correction
    logprobs_mode: processed_logprobs
    val_kwargs:                   # validation samples like training does
      do_sample: true
      temperature: 1.0
      n: 1
    checkpoint_engine:
      update_weights_bucket_megabytes: 3072
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    multi_turn:
      enable: true
      format: bash                # envs.commons.tool's <bash> tags, for every model
      max_assistant_turns: 64     # a ceiling; each episode enforces its own turns
      max_tool_response_length: 4000
    agent:
      num_workers: 8              # each runs training.loop.EpisodeLoop (loops.yaml)

reward:
  num_workers: 2                  # unused (the loop grades), but verl starts them

transfer_queue:
  backend:
    SimpleStorage:
      num_data_storage_units: 2

ray_kwargs:
  ray_init:
    num_cpus: ${oc.decode:${oc.env:SLURM_CPUS_ON_NODE,32}}  # the job's CPUs, not the node's

trainer:
  logger: [console]               # training.progress sends to wandb
  project_name: cheatboxes
  experiment_name: ${oc.env:EXP,cheatboxes}
  n_gpus_per_node: 1           # the preset sets it
  nnodes: 1
  val_before_train: false         # training only; see README for evaluating
  test_freq: -1
  save_freq: 10                   # LoRA + Adam
  total_training_steps: 2500      # a new instance every time: no epochs
  total_epochs: 1
  log_val_generations: 0
  default_local_dir: ${oc.env:CHECKPOINT_DIR,${oc.env:RUN_DIR,runs/${trainer.experiment_name}}}
  resume_mode: auto
  max_actor_ckpt_to_keep: 1       # enough to resume
