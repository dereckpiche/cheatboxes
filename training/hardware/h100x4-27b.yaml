# @package _global_
# 4 H100 (80 GB), a 27B model: the actor sharded over the 4 GPUs (a full
# replica per GPU is 58 GB: it starved vLLM, Mila 2026-11-13) and parked in
# CPU memory between updates, its logits processed in chunks; two vLLM
# replicas of two GPUs each at 60% of the GPU.

trainer:
  n_gpus_per_node: 4

actor_rollout_ref:
  actor:
    entropy_from_logits_with_chunking: true
    entropy_checkpointing: true
    fsdp_config:
      fsdp_size: -1
      model_dtype: bf16
      param_offload: true
      optimizer_offload: true
  ref:
    fsdp_config:
      fsdp_size: -1
      model_dtype: bf16
  rollout:
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.6
