# @package _global_
# 2 L40S (48 GB), a 4B model: the 1-L40S recipe, one replica per GPU. vLLM
# gets 40% of each GPU; the actor's weights and Adam wait in CPU memory;
# logits are processed in chunks and in packs of one sequence at most; the
# frozen base is bf16 (PEFT keeps the LoRA adapters in fp32). Not yet run.

trainer:
  n_gpus_per_node: 2

actor_rollout_ref:
  actor:
    entropy_from_logits_with_chunking: true
    entropy_checkpointing: true
    ppo_max_token_len_per_gpu: 7168
    fsdp_config:
      model_dtype: bf16
      param_offload: true
      optimizer_offload: true
  ref:
    log_prob_max_token_len_per_gpu: 7168
    fsdp_config:
      model_dtype: bf16
  rollout:
    gpu_memory_utilization: 0.4
    # One sequence per log-prob pass: packing several long episodes ran out
    # of memory on their logits (9.6 GB, Mila 2026-11-21, 600-char files).
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 7168
